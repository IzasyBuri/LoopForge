[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopforge"
version = "0.1.0"
description = "Desktop media loop workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]

[project.scripts]
loopforge = "loopforge.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loopforge = ["*.qss"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
